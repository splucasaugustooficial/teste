name: craft

on:
  push:
    paths: [".agents/skills/craft/**", ".claude/skills/craft/**", "AGENTS.md", ".github/workflows/craft.yml"]
  pull_request:
    paths: [".agents/skills/craft/**", ".claude/skills/craft/**", "AGENTS.md", ".github/workflows/craft.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck .agents/skills/craft/scripts/*.sh .agents/skills/craft/tests/*.sh
      - name: testes do checks.sh
        run: bash .agents/skills/craft/tests/test_checks.sh
      - name: testes do install.sh
        run: bash .agents/skills/craft/tests/test_install.sh
      - name: cópias da skill sincronizadas
        run: bash .agents/skills/craft/scripts/install.sh --check
