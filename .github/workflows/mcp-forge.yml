name: mcp-forge

on:
  push:
    paths: [".agents/skills/mcp-forge/**", ".github/workflows/mcp-forge.yml"]
  pull_request:
    paths: [".agents/skills/mcp-forge/**", ".github/workflows/mcp-forge.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s .agents/skills/mcp-forge/tests -v
      - run: shellcheck .agents/skills/mcp-forge/scripts/install.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: gerar, compilar e testar servidores TS e Python
        env:
          MCP_FORGE_E2E: "1"
        run: python3 -m unittest discover -s .agents/skills/mcp-forge/tests -v
