name: Snake Livre

on:
  push:
    paths:
      - "www/**"
      - "test/**"
      - "package.json"
      - "android/**"
      - "tools/**"
      - ".github/workflows/snake-livre.yml"
  pull_request:
    paths:
      - "www/**"
      - "test/**"
      - "package.json"
      - "android/**"
      - "tools/**"
      - ".github/workflows/snake-livre.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: regras do jogo
        run: npm test
