name: Snake Livre

on:
  push:
    paths:
      - "criacao/**"
      - "atualizacoes/**"
      - "apk/**"
      - "backup/**"
      - ".github/workflows/snake-livre.yml"
  pull_request:
    paths:
      - "criacao/**"
      - "atualizacoes/**"
      - "apk/**"
      - "backup/**"
      - ".github/workflows/snake-livre.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: regras do jogo original
        working-directory: criacao
        run: npm test
      - name: regras da pasta de atualizações
        working-directory: atualizacoes
        run: npm test
