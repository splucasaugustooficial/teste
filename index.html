<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Foco</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
            color: #333;
        }
        #game-area {
            position: relative;
            width: 80vw;
            height: 70vh;
            margin: 20px auto;
            background: #fff;
            border: 2px solid #333;
            overflow: hidden;
        }
        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #4CAF50;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }
        #info {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Jogo de Foco</h1>
    <div id="info">Clique nos números de 1 a 10 em ordem!</div>
    <div id="game-area"></div>
    <script>
        const area = document.getElementById('game-area');
        const info = document.getElementById('info');
        let current = 1;

        function createTarget(number) {
            const div = document.createElement('div');
            div.className = 'target';
            div.textContent = number;
            const maxX = area.clientWidth - 50;
            const maxY = area.clientHeight - 50;
            div.style.left = Math.random() * maxX + 'px';
            div.style.top = Math.random() * maxY + 'px';

            div.addEventListener('click', () => {
                if (number === current) {
                    div.remove();
                    current++;
                    if (current <= 10) {
                        createTarget(current);
                        info.textContent = `Próximo número: ${current}`;
                    } else {
                        info.textContent = 'Parabéns! Você completou o jogo.';
                    }
                } else {
                    info.textContent = `Ops! Clique no número ${current}.`;
                }
            });

            area.appendChild(div);
        }

        createTarget(current);
    </script>
</body>
</html>
